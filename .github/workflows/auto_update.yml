name: Super Fast Live Tenders Update

on:
  schedule:
    # ప్రతి 20 నుండి 30 నిమిషాలకు ఒకసారి రన్ అయి డేటాను లైవ్‌లో ఉంచుతుంది
    - cron: '*/20 * * * *'  
  workflow_dispatch: # మాన్యువల్‌గా రన్ చేసుకోవడానికి

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add tenders.json
        git commit -m "Real-time Live Tenders Sync" || exit 0
        git push
