name: Auto Update Tenders Data Every Hour

on:
  schedule:
    # ప్రతి గంటకు (Every 60 minutes) బ్యాక్‌గ్రౌండ్‌లో ఆటోమేటిక్‌గా రన్ అవుతుంది
    - cron: '0 * * * *'  
  workflow_dispatch:      # మీకు కావాలనుకున్నప్పుడు మాన్యువల్‌గా రన్ చేసుకోవడానికి

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add tenders.json
        git commit -m "Hourly automated tenders update" || exit 0
        git push
